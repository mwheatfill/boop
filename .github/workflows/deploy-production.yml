name: Deploy to production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Opt into Node.js 24 for the v4 actions; removes the deprecation warning
  # and matches the worker runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Tells the Cloudflare Vite plugin to use the production wrangler config
      # so dist/server/wrangler.json gets the production worker name + D1.
      WRANGLER_CONFIG: wrangler.production.jsonc
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Quality gates
        # Intentional re-verification on the tagged SHA. main.yml ran the
        # same gates on whatever main pointed at when the commit landed,
        # but tags can be cut from older commits or via workflow_dispatch
        # on arbitrary refs. Belt-and-suspenders for production.
        run: |
          pnpm check
          pnpm build
          pnpm test
          pnpm openapi:check

      - name: Apply D1 migrations to production
        run: |
          if compgen -G "drizzle/*.sql" > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --config wrangler.production.jsonc --remote
          else
            echo "No migrations to apply (empty schema)."
          fi

      - name: Deploy to production
        # wrangler reads dist/server/wrangler.json (built from
        # wrangler.production.jsonc above); no --config needed here.
        run: pnpm exec wrangler deploy
