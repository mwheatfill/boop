name: Deploy to production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Opt into Node.js 24 for the v4 actions; removes the deprecation warning
  # and matches the worker runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
    env:
      # Tells the Cloudflare Vite plugin to merge the env.production block
      # from wrangler.jsonc into dist/server/wrangler.json. Without this,
      # the build would default to the top-level (dev) config.
      CLOUDFLARE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Quality gates
        # Intentional re-verification on the tagged SHA. main.yml ran the
        # same gates on whatever main pointed at when the commit landed,
        # but tags can be cut from older commits or via workflow_dispatch
        # on arbitrary refs. Belt-and-suspenders for production.
        run: |
          pnpm check
          pnpm build
          pnpm test
          pnpm openapi:check

      - name: Apply D1 migrations to production
        # `wrangler d1` reads wrangler.jsonc directly (not the dist
        # version), so it needs --env production to pick the prod D1
        # binding from the env.production block.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if compgen -G "drizzle/*.sql" > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --env production --remote
          else
            echo "No migrations to apply (empty schema)."
          fi

      - name: Deploy to production
        # cloudflare/wrangler-action@v3 is Cloudflare's canonical CI deploy
        # action. The Quality gates step already built with
        # CLOUDFLARE_ENV=production, so .wrangler/deploy/config.json
        # redirects wrangler to a dist config where env.production has
        # been merged into the top level — plain `deploy` is enough.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
