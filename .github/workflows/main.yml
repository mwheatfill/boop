name: Main

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Opt into Node.js 24 for the v4 actions; removes the deprecation warning
  # and matches the worker runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        # Composite action handles pnpm + node + install. See
        # .github/actions/setup/action.yml. Checkout has to run first
        # at the workflow level — a local `uses:` can't be resolved
        # until the action file is on disk.

      - name: Lint and format
        run: pnpm check

      - name: Type check + build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: OpenAPI contract in sync
        run: pnpm openapi:check

      - name: Audit patterns (canonical-stack enforcement)
        # Runs the three audits in scripts/audit-patterns/:
        #   - shadcn: structural-diff src/components/ui against the live
        #     shadcn registry; catches hand-rolled drift.
        #   - tanstack: structural assertions for canonical TSS / Router /
        #     Query patterns (verbatimModuleSyntax off, root uses with-
        #     context, server fns have real validators, etc.).
        #   - preferences: grep src/ for forbidden imports declared in
        #     agent-rules/preferences.md.
        # See ADR-0011 for the why.
        run: pnpm audit:patterns

      - name: Upload audit-patterns report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.md
          retention-days: 7
          if-no-files-found: warn

      - name: Comment audit-patterns report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('audit-report.md')) return;
            const body = fs.readFileSync('audit-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Find an existing comment from this bot to update in place.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const marker = '# Audit patterns report';
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: TanStack Intent skill freshness (soft)
        run: pnpm intent:stale
        continue-on-error: true

      - name: Upload build artifact
        # deploy-dev consumes this so it doesn't have to re-run pnpm build
        # on a fresh runner. dist/ holds the worker bundle + client assets
        # that wrangler deploy uploads. .wrangler/deploy/config.json is the
        # redirect file the Cloudflare Vite plugin writes during build —
        # wrangler follows it to read dist/server/wrangler.json (resolved
        # entry, baked-in env). Without this file, wrangler falls back to
        # the raw wrangler.jsonc and trips on the virtual main entry.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            .wrangler/deploy/config.json
          retention-days: 1
          if-no-files-found: error

  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download build artifact
        # Skips the rebuild on the deploy runner. Build was already proven
        # green by the check job; reusing the same dist/ guarantees we deploy
        # exactly what passed the gates. Default path restores both dist/
        # and .wrangler/deploy/config.json at workspace root so the plugin's
        # deploy redirect points wrangler at the dist config.
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Apply D1 migrations to dev
        # The dev D1 binding lives at the top level of wrangler.jsonc, so
        # no --env flag is needed. Production deploys pass --env production
        # in deploy-production.yml to select the env.production block.
        run: |
          if compgen -G "drizzle/*.sql" > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --remote
          else
            echo "No migrations to apply (empty schema)."
          fi

      - name: Deploy to dev
        # The Cloudflare Vite plugin's .wrangler/deploy/config.json (restored
        # from the artifact) redirects wrangler to dist/server/wrangler.json,
        # which has the resolved entry and dev bindings baked in. The check
        # job built without CLOUDFLARE_ENV, so the dist top-level is dev.
        run: pnpm exec wrangler deploy
