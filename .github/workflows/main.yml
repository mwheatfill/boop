name: Main

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        # Composite action handles pnpm + node + install. See
        # .github/actions/setup/action.yml. Checkout has to run first
        # at the workflow level — a local `uses:` can't be resolved
        # until the action file is on disk.

      - name: Lint and format
        run: pnpm check

      - name: Type check + build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: OpenAPI contract in sync
        run: pnpm openapi:check

      - name: Audit patterns (structural backstop)
        # shadcn registry diff, TanStack canonical-pattern assertions,
        # architectural-seam guards. See ADR-009.
        run: pnpm audit:patterns

      - name: Upload audit-patterns report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.md
          retention-days: 7
          if-no-files-found: warn

      - name: Comment audit-patterns report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('audit-report.md')) return;
            const body = fs.readFileSync('audit-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Find an existing comment from this bot to update in place.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const marker = '# Audit patterns report';
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: TanStack Intent skill freshness (soft)
        run: pnpm intent:stale
        continue-on-error: true

  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        # Re-runs vite build so .wrangler/deploy/config.json (the redirect
        # file the Cloudflare Vite plugin writes) lives next to the freshly
        # built dist/. Cheaper and simpler than passing a build artifact
        # between jobs — the whole build is ~3s.
        run: pnpm build

      - name: Apply D1 migrations to dev
        # Dev D1 binding lives at the top level of wrangler.jsonc, so no
        # --env flag. The check job already proved migrations parse cleanly;
        # this applies them remotely. compgen guard makes the step a no-op
        # while the schema is empty.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if compgen -G "drizzle/*.sql" > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --remote
          else
            echo "No migrations to apply (empty schema)."
          fi
          pnpm exec wrangler d1 execute DB --remote --file scripts/starter-recipes.sql
          pnpm exec wrangler d1 execute DB --remote --file scripts/seed-default-workspace.sql

      - name: Deploy to dev
        # cloudflare/wrangler-action is Cloudflare's canonical CI deploy
        # action. It detects the existing pnpm-installed wrangler, then runs
        # `wrangler deploy`, which follows .wrangler/deploy/config.json to
        # use the resolved dist/server/wrangler.json (dev bindings baked in
        # since the build ran without CLOUDFLARE_ENV).
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
