name: Main

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Opt into Node.js 24 for the v4 actions; removes the deprecation warning
  # and matches the worker runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
        # Composite action handles checkout + pnpm + node + install. See
        # .github/actions/setup/action.yml. We can't `uses:` a local action
        # without first checking out the repo — but composite actions work
        # around this because the runner does an implicit shallow clone of
        # the workflow ref before resolving local `uses:` paths.

      - name: Lint and format
        run: pnpm check

      - name: Type check + build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: OpenAPI contract in sync
        run: pnpm openapi:check

      - name: Audit patterns (canonical-stack enforcement)
        # Runs the three audits in scripts/audit-patterns/:
        #   - shadcn: structural-diff src/components/ui against the live
        #     shadcn registry; catches hand-rolled drift.
        #   - tanstack: structural assertions for canonical TSS / Router /
        #     Query patterns (verbatimModuleSyntax off, root uses with-
        #     context, server fns have real validators, etc.).
        #   - preferences: grep src/ for forbidden imports declared in
        #     agent-rules/preferences.md.
        # See ADR-0011 for the why.
        run: pnpm audit:patterns

      - name: Upload audit-patterns report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.md
          retention-days: 7
          if-no-files-found: warn

      - name: Comment audit-patterns report on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('audit-report.md')) return;
            const body = fs.readFileSync('audit-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Find an existing comment from this bot to update in place.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const marker = '# Audit patterns report';
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: TanStack Intent skill freshness (soft)
        run: pnpm intent:stale
        continue-on-error: true

      - name: Upload build artifact
        # deploy-dev consumes this so it doesn't have to re-run pnpm build
        # on a fresh runner. dist/ holds both the worker bundle and the
        # client assets that wrangler deploy uploads.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: ./.github/actions/setup

      - name: Download build artifact
        # Skips the rebuild on the deploy runner. Build was already proven
        # green by the check job; reusing the same dist/ guarantees we deploy
        # exactly what passed the gates.
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Apply D1 migrations to dev
        # The dev D1 binding lives at the top level of wrangler.jsonc, so
        # no --env flag is needed. Production deploys pass --env production
        # in deploy-production.yml to select the env.production block.
        run: |
          if compgen -G "drizzle/*.sql" > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --remote
          else
            echo "No migrations to apply (empty schema)."
          fi

      - name: Deploy to dev
        # wrangler reads dist/server/wrangler.json that the Cloudflare
        # Vite plugin wrote during the check job's build. Without
        # CLOUDFLARE_ENV set, the plugin used the top-level (dev) config,
        # so the dist worker name and bindings already point at dev.
        run: pnpm exec wrangler deploy
