name: Main

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Opt into Node.js 24 for the v4 actions; removes the deprecation warning
  # and matches the worker runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Type check + build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: OpenAPI contract in sync
        run: pnpm openapi:check

      - name: TanStack Intent skill freshness (soft)
        run: pnpm intent:stale
        continue-on-error: true

  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Apply D1 migrations to dev
        # No --config flag: wrangler d1 defaults to wrangler.jsonc, which
        # holds the dev D1 binding. Production has its own --config flag
        # in deploy-production.yml pointing at wrangler.production.jsonc.
        run: |
          if compgen -G "drizzle/*.sql" > /dev/null; then
            pnpm exec wrangler d1 migrations apply DB --remote
          else
            echo "No migrations to apply (empty schema)."
          fi

      - name: Deploy to dev
        # No --env flag: TSS Vite plugin flattens wrangler.jsonc and
        # drops env: blocks; top-level config is what actually deploys.
        # Top-level wrangler.jsonc currently points at the dev D1.
        run: pnpm exec wrangler deploy
