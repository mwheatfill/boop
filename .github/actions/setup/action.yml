name: Setup
description: |
  Install pnpm and Node, restore pnpm cache, and install dependencies.
  Used by every workflow in this repo so the install pipeline stays
  defined in exactly one place. Caller must run actions/checkout before
  this action: a local `uses: ./.github/actions/setup` cannot be resolved
  until the repo is on disk, so checkout has to live in the workflow.

inputs:
  node-version:
    description: Node.js version to install. Matches the worker runtime.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
